version: '3.8'

services:
  qwen3-tts:
    build: .
    image: qwen3-tts:latest
    container_name: qwen3-tts
    
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Resources
    shm_size: '8gb'
    ulimits:
      memlock: -1
    
    # Environment
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TTS_MODEL_SIZE=1.7B
      - TTS_PORT=9100
      # Uncomment and set your HuggingFace token if models are gated:
      # - HF_TOKEN=hf_xxxxx
    
    # Ports
    ports:
      - "9100:9100"
    
    # Persist downloaded models
    volumes:
      - tts-models:/app/models
      - tts-hf-cache:/root/.cache/huggingface
    
    # Restart policy
    restart: unless-stopped

volumes:
  tts-models:
  tts-hf-cache:
