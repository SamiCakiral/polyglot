name: CI

on:
  pull_request:
  push:
    branches: [main, codex/v2-rebuild]

permissions:
  contents: read

jobs:
  registry-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
      - name: Validate canonical W00 registries
        run: python3 scripts/validate_contract_registry.py contracts/registry contracts/tests
      - name: Execute W00 validator tests
        run: python3 -m unittest discover -s contracts/tests -p 'test_*.py'

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install locked backend
        working-directory: backend
        run: uv sync --locked
      - name: Ruff
        working-directory: backend
        run: uv run ruff check src tests
      - name: Mypy
        working-directory: backend
        run: uv run mypy src
      - name: Unit and property tests
        working-directory: backend
        run: uv run pytest tests/unit tests/property -q

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify deterministic generated client
        run: |
          pnpm --dir frontend generate:api
          git diff --exit-code -- frontend/src/generated
      - name: Lint frontend
        run: pnpm --dir frontend lint
      - name: Typecheck frontend
        run: pnpm --dir frontend typecheck
      - name: Test frontend shell
        run: pnpm --dir frontend test --run
      - name: Build frontend
        run: pnpm --dir frontend build

  frontend-browser:
    runs-on: ubuntu-latest
    needs: frontend-quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install pinned Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Test shell in real browser
        run: pnpm --dir frontend exec playwright test
      - name: Archive non-approved browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w17-shell-browser-evidence
          path: frontend/test-results/w17-shell
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install locked backend
        working-directory: backend
        run: uv sync --locked
      - name: Scan tracked files and Git history for secrets
        working-directory: backend
        run: uv run python -m polyglot.platform.security_checks --repository-root ..
      - name: Audit locked Python dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit \
            --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan pinned PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          scan-type: image
          image-ref: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          trivyignores: .trivyignore.yaml
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  postgres-platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: polyglot
          POSTGRES_PASSWORD: ci-bootstrap-only
          POSTGRES_USER: polyglot_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyglot_bootstrap -d polyglot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POLYGLOT_MIGRATION_DATABASE_URL: postgresql+asyncpg://polyglot_migration_login:ci-migration-only@127.0.0.1:5432/polyglot
      POLYGLOT_DATABASE_URL: postgresql+asyncpg://polyglot_runtime_login:ci-runtime-only@127.0.0.1:5432/polyglot
      POLYGLOT_RETENTION_DATABASE_URL: postgresql+asyncpg://polyglot_retention_login:ci-retention-only@127.0.0.1:5432/polyglot
      POLYGLOT_MIGRATION_DB_PASSWORD: ci-migration-only
      POLYGLOT_RUNTIME_DB_PASSWORD: ci-runtime-only
      POLYGLOT_RETENTION_DB_PASSWORD: ci-retention-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install locked backend
        working-directory: backend
        run: uv sync --locked
      - name: Provision PostgreSQL identities
        env:
          POLYGLOT_BOOTSTRAP_DATABASE_URL: postgresql://polyglot_bootstrap:ci-bootstrap-only@127.0.0.1:5432/polyglot
        run: ops/postgres/bootstrap-identities.sh
      - name: Upgrade empty database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Verify downgrade and clean re-upgrade
        working-directory: backend
        env:
          POLYGLOT_ALLOW_DESTRUCTIVE_IDENTITY_DOWNGRADE: true
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Verify one head and no metadata drift
        working-directory: backend
        run: |
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1
          uv run alembic check
      - name: Build, install, and migrate from wheel
        working-directory: backend
        run: uv run pytest tests/integration/platform/test_installed_artifact.py -q
      - name: Integration and contract tests
        working-directory: backend
        run: >-
          uv run pytest tests/integration tests/contract
          --ignore=tests/integration/platform/test_installed_artifact.py -q
      - name: Verify deterministic OpenAPI
        working-directory: backend
        run: >-
          uv run python -m polyglot.interfaces.http.export_openapi
          --check ../contracts/openapi/v1.json
