services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: polyglot
      POSTGRES_PASSWORD: ${POLYGLOT_POSTGRES_PASSWORD:?POLYGLOT_POSTGRES_PASSWORD must be set}
      POSTGRES_USER: polyglot
    ports:
      - "127.0.0.1:${POLYGLOT_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyglot -d polyglot"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - polyglot-postgres:/var/lib/postgresql/data

volumes:
  polyglot-postgres:

x-polyglot-object-storage:
  mode: filesystem-placeholder
  path: ${POLYGLOT_OBJECT_STORAGE_PATH:-.local/object-storage}
