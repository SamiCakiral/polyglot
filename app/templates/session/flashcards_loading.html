{% extends 'base.html' %}
{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}
{% block title %}Vocabulaire - Chargement{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:1.5rem;">
    <div class="spinner" style="width:48px; height:48px; border:4px solid #e2e8f0; border-top-color:#6366f1; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <h2 style="color:#1e293b; font-size:1.3rem;">Generation du vocabulaire...</h2>
    <p style="color:#94a3b8; font-size:0.9rem;">Les cartes sont en cours de creation. Patiente quelques secondes.</p>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
// Auto-generate words then reload to start training
(async function() {
    try {
        const res = await fetch('{{ url_for("session.generate_daily_words") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ count: 15 })
        });
        const data = await res.json();
        if (data.success) {
            // Words generated, reload to create training session
            window.location.href = '{{ url_for("session.module_flashcards") }}';
        } else {
            document.querySelector('h2').textContent = 'Erreur de generation';
            document.querySelector('p').textContent = data.error || 'Veuillez rafraichir la page.';
        }
    } catch(e) {
        document.querySelector('h2').textContent = 'Erreur serveur';
        document.querySelector('p').textContent = 'Veuillez rafraichir la page.';
    }
})();
</script>
{% endblock %}
