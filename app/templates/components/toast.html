{#
    Toast Component - Reusable toast notifications
    
    Usage in templates:
    {% include 'components/toast.html' %}
    
    Then in JavaScript:
    showToast('Message', 'success');  // success, error, warning, info
    showToast('Error!', 'error', 5000);  // custom duration in ms
#}

<div id="toast-container" class="toast-container"></div>

<style>
.toast-container {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    pointer-events: none;
}

.toast-container.top {
    bottom: auto;
    top: 2rem;
}

.toast-container.top-right {
    bottom: auto;
    top: 2rem;
    left: auto;
    right: 2rem;
    transform: none;
}

.toast-container.bottom-right {
    left: auto;
    right: 2rem;
    transform: none;
}

.toast {
    padding: 0.875rem 1.25rem;
    border-radius: 12px;
    background: var(--card-bg, #ffffff);
    border: 1px solid var(--border-color, #e5e7eb);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 280px;
    max-width: 400px;
    animation: toast-in 0.3s ease;
    pointer-events: auto;
}

.toast-icon {
    font-size: 1.25rem;
    flex-shrink: 0;
}

.toast-message {
    flex: 1;
    font-size: 0.95rem;
    line-height: 1.4;
}

.toast-close {
    background: none;
    border: none;
    font-size: 1.25rem;
    cursor: pointer;
    color: var(--text-secondary, #6b7280);
    padding: 0;
    line-height: 1;
    opacity: 0.6;
    transition: opacity 0.2s;
}

.toast-close:hover {
    opacity: 1;
}

/* Variants */
.toast-success {
    border-color: #10b981;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
}

.toast-success .toast-icon {
    color: #059669;
}

.toast-error {
    border-color: #ef4444;
    background: linear-gradient(135deg, #fef2f2, #fecaca);
}

.toast-error .toast-icon {
    color: #dc2626;
}

.toast-warning {
    border-color: #f59e0b;
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
}

.toast-warning .toast-icon {
    color: #d97706;
}

.toast-info {
    border-color: #3b82f6;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
}

.toast-info .toast-icon {
    color: #2563eb;
}

/* Animations */
@keyframes toast-in {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.toast-fade {
    animation: toast-out 0.3s ease forwards;
}

@keyframes toast-out {
    from {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    to {
        opacity: 0;
        transform: translateY(-20px) scale(0.95);
    }
}

/* Progress bar for timed toasts */
.toast-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: currentColor;
    opacity: 0.3;
    border-radius: 0 0 12px 12px;
    transform-origin: left;
    animation: toast-progress linear forwards;
}

@keyframes toast-progress {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
}

/* Mobile adjustments */
@media (max-width: 480px) {
    .toast-container {
        left: 1rem;
        right: 1rem;
        transform: none;
    }
    
    .toast {
        min-width: auto;
        max-width: none;
    }
}
</style>

<script>
// Toast icons
const TOAST_ICONS = {
    success: '✓',
    error: '✕',
    warning: '⚠',
    info: 'ℹ'
};

// Default durations
const TOAST_DURATIONS = {
    success: 3000,
    error: 5000,
    warning: 4000,
    info: 3000
};

/**
 * Show a toast notification
 * @param {string} message - The message to display
 * @param {string} type - Toast type: success, error, warning, info
 * @param {number} duration - Duration in ms (0 for persistent)
 * @param {object} options - Additional options
 */
function showToast(message, type = 'info', duration = null, options = {}) {
    const container = document.getElementById('toast-container') || createToastContainer();
    
    // Use default duration if not specified
    if (duration === null) {
        duration = TOAST_DURATIONS[type] || 3000;
    }
    
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    
    const icon = options.icon || TOAST_ICONS[type] || 'ℹ';
    const showClose = options.showClose !== false;
    const showProgress = duration > 0 && options.showProgress !== false;
    
    toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span class="toast-message">${message}</span>
        ${showClose ? '<button class="toast-close" onclick="this.parentElement.remove()">&times;</button>' : ''}
        ${showProgress ? `<div class="toast-progress" style="animation-duration: ${duration}ms"></div>` : ''}
    `;
    
    container.appendChild(toast);
    
    // Auto-remove after duration
    if (duration > 0) {
        setTimeout(() => {
            if (toast.parentNode) {
                toast.classList.add('toast-fade');
                setTimeout(() => toast.remove(), 300);
            }
        }, duration);
    }
    
    // Return toast element for manual control
    return {
        element: toast,
        close: () => {
            toast.classList.add('toast-fade');
            setTimeout(() => toast.remove(), 300);
        },
        update: (newMessage) => {
            toast.querySelector('.toast-message').textContent = newMessage;
        }
    };
}

/**
 * Create toast container if it doesn't exist
 */
function createToastContainer(position = 'bottom-center') {
    let container = document.getElementById('toast-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    return container;
}

/**
 * Shorthand functions
 */
function showSuccess(message, duration) {
    return showToast(message, 'success', duration);
}

function showError(message, duration) {
    return showToast(message, 'error', duration);
}

function showWarning(message, duration) {
    return showToast(message, 'warning', duration);
}

function showInfo(message, duration) {
    return showToast(message, 'info', duration);
}

/**
 * Clear all toasts
 */
function clearToasts() {
    const container = document.getElementById('toast-container');
    if (container) {
        container.innerHTML = '';
    }
}
</script>
