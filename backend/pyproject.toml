[project]
name = "polyglot-v2-backend"
version = "0.1.0"
description = "Polyglot V2 modular backend"
requires-python = "==3.13.11"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "greenlet==3.5.4",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyglot"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "polyglot/migrations/alembic.ini"
"migrations" = "polyglot/migrations"
"../contracts/events/envelope.schema.json" = "polyglot/platform/contracts/envelope.schema.json"
"../contracts/events/event-catalogue.yaml" = "polyglot/platform/contracts/event-catalogue.yaml"

[dependency-groups]
dev = [
  "hypothesis==6.165.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
